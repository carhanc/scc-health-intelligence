name: Scheduled data refresh

# Rebuilds the full production warehouse from live sources, audits it,
# publishes a new GitHub Release data artifact if every check passes,
# then genuinely DELIVERS it: triggers the Render backend's deploy hook
# and polls /api/v1/version until it reports the newly published
# build_id, failing loudly on timeout or mismatch. A failed or partial
# build never overwrites the last-known-good published artifact and
# never touches the live deployment at all (build-validate-publish-
# deliver, per docs/data/refresh-runbook.md). Deliberately never
# triggers a frontend (Vercel) deployment -- a data-only refresh has
# nothing for the frontend to rebuild. Kept entirely separate from PR CI
# (docs/04_ARCHITECTURE_IMPLEMENTATION.md §17) since this hits live,
# rate-limited external sources and can take significant time.
#
# Requires repo secrets/variables (see
# docs/deployment/production-deployment-guide.md):
#   CENSUS_API_KEY, HUD_USER_TOKEN (optional -- both sources have a
#     keyless fallback, but the keyed path is faster/more reliable)
#   RENDER_DEPLOY_HOOK_URL (secret) -- if unset, this workflow still
#     publishes the release but skips the deploy-and-verify steps, with
#     a clear warning, rather than silently failing.
#   PRODUCTION_BACKEND_URL (variable) -- required alongside the hook URL
#     to know where to poll /api/v1/version.
#   The built-in `github.token` authenticates the `gh release create`
#     call in the publish step (this repository is private).

on:
  schedule:
    # Monthly, first of the month, 06:00 UTC -- matches this platform's
    # source cadence (ACS/PLACES/CalEnviroScreen/SVI are annual releases;
    # HCAI utilization data is annual; nothing here needs daily refresh).
    - cron: "0 6 1 * *"
  workflow_dispatch: {} # manual trigger for an out-of-cycle refresh

permissions:
  contents: write # required to create a GitHub Release

concurrency:
  group: scheduled-refresh
  cancel-in-progress: false # never cancel a build partway through

jobs:
  refresh:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Build the full production warehouse
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          HUD_USER_TOKEN: ${{ secrets.HUD_USER_TOKEN }}
        run: make data

      - name: Audit the build (must pass before anything is published)
        run: make audit

      - name: Build the production manifest (fails loudly on any missing schema/table)
        run: make data-manifest

      - name: Run the backend test suite against the freshly built warehouse
        run: uv run pytest apps/api/tests -q

      - name: Publish as a GitHub Release (only reached if every prior step passed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/publish_data_artifact.py --publish

      - name: Trigger Render deploy to deliver the new build
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -sf -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Poll production until it reports the new build_id
        if: env.RENDER_DEPLOY_HOOK_URL != '' && env.PRODUCTION_BACKEND_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          PRODUCTION_BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_URL }}
        run: |
          EXPECTED_BUILD_ID=$(python3 -c "import json; print(json.load(open('DATA_MANIFEST.production.json'))['build_id'])")
          echo "Waiting for $PRODUCTION_BACKEND_URL to report data_build_id=$EXPECTED_BUILD_ID ..."
          for i in $(seq 1 30); do
            ACTUAL_BUILD_ID=$(curl -sf "$PRODUCTION_BACKEND_URL/api/v1/version" | python3 -c "import json,sys; print(json.load(sys.stdin).get('data_build_id') or '')" 2>/dev/null || echo "")
            if [ "$ACTUAL_BUILD_ID" = "$EXPECTED_BUILD_ID" ]; then
              echo "Confirmed: production is now serving build_id=$ACTUAL_BUILD_ID."
              exit 0
            fi
            echo "  attempt $i/30: production reports '$ACTUAL_BUILD_ID' (waiting for '$EXPECTED_BUILD_ID') -- retrying in 20s"
            sleep 20
          done
          echo "::error::Timed out after 10 minutes waiting for production to report the new build_id ($EXPECTED_BUILD_ID). The release was published, but delivery to the live backend could not be confirmed -- check the Render deploy manually."
          exit 1

      - name: Delivery skipped (no Render deploy hook configured yet)
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "::warning::RENDER_DEPLOY_HOOK_URL is not set -- the new release was published, but"
          echo "no deploy was triggered. The backend will still pick it up on its next deploy"
          echo "(DATA_ARTIFACT_RELEASE_TAG=latest). Set the secret to automate delivery -- see"
          echo "docs/deployment/production-deployment-guide.md."

      - name: Summary
        if: always()
        run: |
          if [ -f DATA_MANIFEST.production.json ]; then
            echo "### Scheduled refresh result" >> "$GITHUB_STEP_SUMMARY"
            python3 -c "
          import json
          m = json.load(open('DATA_MANIFEST.production.json'))
          print(f\"- build_id: {m['build_id']}\")
          print(f\"- total_tables: {m['total_tables']}\")
          print(f\"- total_rows: {m['total_rows']:,}\")
          " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Scheduled refresh FAILED before a manifest was produced" >> "$GITHUB_STEP_SUMMARY"
            echo "The previously published data artifact was never touched -- nothing to roll back." >> "$GITHUB_STEP_SUMMARY"
          fi
