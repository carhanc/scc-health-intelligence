name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: macos-14 # Apple Silicon runner, matches the project's target platform
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Enable Corepack
        run: corepack enable

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install Python
        run: uv python install 3.12

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync

      - name: Clean-room check
        run: uv run python scripts/check_clean_room.py

      - name: Lint (Python)
        run: uv run ruff check .

      - name: Lint (TypeScript)
        run: pnpm -r lint

      - name: Typecheck (Python)
        run: uv run mypy apps/api/src pipelines/src

      - name: Typecheck (TypeScript)
        run: pnpm -r typecheck

      - name: Unit tests (Python)
        run: uv run pytest apps/api/tests pipelines/tests

      - name: Unit tests (TypeScript)
        run: pnpm -r test

      - name: Build web app
        run: pnpm --filter @scc-health/web build

  # Live-source refresh jobs are intentionally kept separate from PR CI
  # (docs/04_ARCHITECTURE_IMPLEMENTATION.md §17) — added in Phase 3 as a
  # scheduled workflow, not a pull-request gate.
