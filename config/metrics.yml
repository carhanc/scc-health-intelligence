# Metric registry — drives every score and UI label (PLAN.md §10,
# docs/03_ANALYTICS_METHODS.md §3). No formula is duplicated elsewhere:
# pipelines/src/scc_health_pipeline/scoring/* and the API both read
# metric metadata from here.
#
# Field reference (see metrics/registry.py::MetricDefinition):
#   transform: "none" (direct column read) | "acs_ratio" (numerator/
#     denominator ACS lines) | "acs_sum_ratio" (sum of several ACS lines
#     over a denominator line) | "precomputed" (reads a table already
#     built by an earlier pipeline stage, e.g. a geospatial join).
#   uncertainty_type: "places_ci" (95% CI bounds present) | "acs_moe"
#     (standard_error present, derived from a 90% MOE) | "none" (source
#     provides no usable uncertainty field for this specific metric).
#
# Domain/subdomain mapping decisions and data-availability gaps (e.g. no
# language/navigation subdomain — no ACS language-isolation table was
# ingested in Phase 3, DEC-020) are recorded in DECISIONS.md.

metrics:
  # ============================================================
  # health_burden (source: CDC PLACES 2025, health.places_observations)
  # ============================================================
  - metric_id: places_diabetes_prevalence
    label: "Diabetes prevalence"
    domain: health_burden
    subdomain: cardiometabolic
    source_id: cdc_places_tract_2025
    source_table: health.places_observations
    source_field: data_value
    source_filter: {measure_id: DIABETES}
    unit: "%"
    direction: concern_high
    transform: none
    uncertainty_type: places_ci
    minimum_coverage: 0.9
    allowed_geographies: [tract]
    plain_language_definition: "Share of adults who report having been told by a health professional that they have diabetes."
    interpretation: "A modeled small-area estimate from CDC PLACES (BRFSS 2022-2023), not a direct tract-level survey — see limitations."
    limitations: "Model-based small-area estimate; subject to modeled-estimate uncertainty; not a tract census."
    citation: "CDC PLACES, 2025 release, tract-level. DATA_MANIFEST.json source_id=cdc_places_tract_2025."

