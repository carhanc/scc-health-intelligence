    interpretation: "Direct ACS 5-year survey estimate (2020-2024), population-count-based and all-ages, distinct from the BRFSS-based adult self-report in places_any_disability."
    limitations: "Margin-of-error propagation across a 12-line sum is not implemented (uncertainty_type: none) -- the underlying ACS lines each carry a MOE in social.acs_observations, but this derived sum's combined uncertainty is not yet computed; treat the point estimate with appropriate caution for small tracts."
    citation: "U.S. Census Bureau ACS 2020-2024 5-year, table B18101. DATA_MANIFEST.json source_id=acs_5year_b18101."

