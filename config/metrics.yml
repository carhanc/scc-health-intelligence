  # ============================================================
  # environmental_burden (source: CalEnviroScreen 5.0)
  # Percentile fields re-percentiled county-relative below (docs/03
  # §2.3/§5.4: never mix a statewide percentile with a county-relative
  # one without labeling -- here the CES statewide percentile is used
  # only as this metric's *raw value*, then re-ranked among Santa Clara
  # County's 408 tracts like every other metric, never displayed as-is
  # alongside a county percentile).
  # ============================================================
  - metric_id: ces_pollution_burden
    label: "Pollution burden (CalEnviroScreen)"
    domain: environmental_burden
    subdomain: pollution_burden
    source_id: calenviroscreen_5_0
    source_table: context.calenviroscreen
    source_field: PollutionP
    unit: "statewide percentile (0-100)"
    direction: concern_high
    transform: none
    uncertainty_type: none
    minimum_coverage: 0.9
    allowed_geographies: [tract]
    plain_language_definition: "CalEnviroScreen 5.0's combined pollution-burden score (statewide percentile), covering exposures (ozone, PM2.5, diesel, pesticides, toxic releases, traffic) and environmental effects (cleanups, groundwater threats, hazardous waste, impaired waters, solid waste sites)."
    interpretation: "This is CalEnviroScreen's own statewide percentile, used here only as a raw input value that this platform re-ranks county-relative (see metric_id note above) -- never displayed as a statewide percentile alongside a county percentile without labeling."
    limitations: "Statewide percentile as sourced; re-ranking it county-relative changes its meaning from 'burden relative to all of California' to 'burden relative to Santa Clara County' -- both are disclosed via the explainability API's source/vintage field."
    citation: "CalEnviroScreen 5.0 (final), OEHHA/CalEPA. DATA_MANIFEST.json source_id=calenviroscreen_5_0."

  - metric_id: ces_population_vulnerability
    label: "Population vulnerability (CalEnviroScreen)"
    domain: environmental_burden
    subdomain: population_vulnerability
    source_id: calenviroscreen_5_0
    source_table: context.calenviroscreen
    source_field: PopCharP
    unit: "statewide percentile (0-100)"
    direction: concern_high
    transform: none
    uncertainty_type: none
    minimum_coverage: 0.9
    allowed_geographies: [tract]
    plain_language_definition: "CalEnviroScreen 5.0's combined population-characteristics score (statewide percentile), covering sensitive populations (asthma, low birth weight, cardiovascular disease, diabetes) and socioeconomic factors (education, linguistic isolation, poverty, unemployment, housing burden)."
    interpretation: "Statewide CalEnviroScreen percentile, re-ranked county-relative in this platform's domain scoring (see ces_pollution_burden note)."
    limitations: "Some component indicators (poverty, linguistic isolation) overlap conceptually with access_barriers metrics from other sources -- CalEnviroScreen's own methodology separates pollution burden from population vulnerability, which this platform preserves as two distinct subdomains rather than re-deriving its own weighting."
    citation: "CalEnviroScreen 5.0 (final), OEHHA/CalEPA. DATA_MANIFEST.json source_id=calenviroscreen_5_0."

  # ============================================================
  # resource_accessibility (precomputed straight-line screening --
  # DEC-024. Full network-routing version is Phase 6 scope.)
  # ============================================================
  - metric_id: nearest_clinical_care_distance
    label: "Distance to nearest clinical-care site (straight-line)"
    domain: resource_accessibility
    subdomain: clinical_care_access
    source_id: derived_resource_accessibility_inputs
    source_table: analytics.resource_accessibility_inputs
    source_field: nearest_clinical_care_distance_miles
    unit: "miles"
    direction: concern_high
    transform: precomputed
    uncertainty_type: none
    minimum_coverage: 0.9
    allowed_geographies: [tract]
    plain_language_definition: "Straight-line distance from the tract's internal point to the nearest clinical-care site (HCAI-licensed general acute care hospital, community/free/surgical clinic, or chronic dialysis clinic; or an active HRSA health center site)."
    interpretation: "A screening-only proxy for access, computed as straight-line ('as the crow flies') distance, NOT a network walking/driving/transit travel time. Every value carries method=straight_line_screening."
    limitations: "Straight-line distance systematically understates real travel time/distance, especially where road networks are indirect; candidate facilities are not deduplicated across HCAI and HRSA source tables (Phase 6 will add both network routing and facility deduplication)."
    citation: "Derived from resources.hcai_facilities (HCAI, CC-BY) and resources.hrsa_health_center_sites (HRSA, public domain); tract anchor from geo.tracts internal point (TIGER/Line 2020)."

  # ============================================================
  # workforce_shortage (precomputed -- DEC-025 direct MUA tract join,
  # DEC-026 HPSA point-based straight-line proximity for Designated,
  # coordinate-bearing HPSA records only)
  # ============================================================
  - metric_id: mua_designated_flag
    label: "Medically Underserved Area/Population designation present"
    domain: workforce_shortage
    subdomain: shortage_designation
    source_id: derived_workforce_shortage_inputs
    source_table: analytics.workforce_shortage_inputs
    source_field: mua_designated
    unit: "binary (0/1)"
    direction: concern_high
    transform: precomputed
    uncertainty_type: none
    minimum_coverage: 1.0
    allowed_geographies: [tract]
    plain_language_definition: "Whether this tract contains at least one currently-Designated HRSA Medically Underserved Area/Population (MUA/P) area, matched directly via the source data's own census-tract field."
    interpretation: "A direct designation match (not a distance proxy) -- HRSA's MUA_DET.csv carries a real census-tract identifier for each MUA/P record, joined here via a verified tract-code format match (46 of 48 Santa Clara County MUA/P records matched; 2 did not match any current 2020 tract and are excluded, logged in the pipeline run output, not silently dropped)."
    limitations: "Binary presence/absence, not a graded intensity; 2 of 48 source MUA/P records could not be matched to a current tract boundary."
    citation: "HRSA MUA_DET.csv. DATA_MANIFEST.json source_id=hrsa_mua_p."

  - metric_id: hpsa_proximity_score
    label: "Nearby Health Professional Shortage Area intensity (straight-line)"
    domain: workforce_shortage
    subdomain: shortage_intensity
    source_id: derived_workforce_shortage_inputs
    source_table: analytics.workforce_shortage_inputs
    source_field: hpsa_proximity_score
    unit: "inverse-distance-weighted HPSA score sum"
    direction: concern_high
    transform: precomputed
    uncertainty_type: none
    minimum_coverage: 1.0
    allowed_geographies: [tract]
    plain_language_definition: "Sum of nearby (within 10 miles), currently-Designated, facility-anchored HPSA scores, each weighted by 1/(1+distance in miles) from the tract's internal point."
    interpretation: "A screening-only straight-line proximity proxy (method=straight_line_screening), not a network-distance or area-overlap-based HPSA assignment. Only facility-anchored HPSA records with real point coordinates and 'Designated' (active) status are included (39 of 148 Santa Clara County HPSA records) -- area-based HPSA records without point geometry, and Withdrawn/Proposed-for-Withdrawal records, are excluded from this score and remain visible only in the raw resources.hrsa_hpsa table."
