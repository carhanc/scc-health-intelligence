[project]
name = "scc-health-api"
version = "0.1.0"
description = "FastAPI backend for Santa Clara Health Intelligence."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.136.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.6.0",
    "uvicorn[standard]>=0.32.0",
    "duckdb>=1.5.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scc_health_api"]
