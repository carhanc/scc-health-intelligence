packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # esbuild: bundler used transitively by Vitest/Vite. sharp: Next.js image
  # optimization. unrs-resolver: ESLint's Rust-based import resolver. All
  # three are well-known, widely used build-time tools with no runtime
  # network/data access — approved for postinstall scripts.
  esbuild: true
  sharp: true
  unrs-resolver: true
  # @sentry/cli's postinstall downloads a native CLI binary used only for
  # source-map upload -- a feature this project deliberately doesn't use
  # yet (see apps/web/instrumentation-client.ts's comment: no source-map
  # upload, capture-only, to avoid needing a build-time auth token).
  # Left disallowed rather than silently allowing an unused native binary
  # download.
  '@sentry/cli': false
overrides:
  # Security floors for transitive build/runtime dependencies. Upstream
  # packages still permit older affected releases, so keep the resolver on
  # the first patched lines until those ranges are tightened upstream.
  postcss: ">=8.5.23"
  nanoid: ">=3.3.18"
  fast-uri: ">=4.1.4"
  js-yaml: ">=4.3.1"
  sharp: ">=0.35.5"
  "brace-expansion@<2.0.0": "1.1.20"
  "brace-expansion@>=4.0.0 <5.0.11": "5.0.11"
  browserslist: ">=4.28.7"
  source-map-js: ">=1.2.2"
  tinypool: ">=2.1.2"
  vite: ">=7.3.7"

auditConfig:
  ignoreGhsas:
    # braces (stack exhaustion on deeply nested patterns). No patched release is
    # published yet (latest is 3.0.3). It is only used by lint tooling through
    # fast-glob and micromatch, never by the website or API at runtime. Remove
    # this line when braces 3.0.4 or newer is published.
    - GHSA-vfj7-8cjw-p6xm
