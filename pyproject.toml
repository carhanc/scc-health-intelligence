[project]
name = "scc-health-intelligence"
version = "0.1.0"
description = "Santa Clara Health Intelligence — open-data public-health intelligence and advocacy platform. Workspace root (not itself a distributable package)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "scc-health-api",
    "scc-health-pipeline",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "pipelines"]

[tool.uv.sources]
scc-health-api = { workspace = true }
scc-health-pipeline = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["data", "warehouse", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection pattern requires Depends(...) as an
# argument default; this is idiomatic, not a real mutable-default bug.
"apps/api/src/scc_health_api/routes/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["data/", "warehouse/", "\\.venv/"]

[[tool.mypy.overrides]]
# geopandas/fiona/pyogrio/shapely's geo stack (and pandas, which
# geopandas.GeoDataFrame extends) does not ship complete type stubs
# (community "types-geopandas"/"pandas-stubs" packages are incomplete);
# this is standard practice for mypy --strict projects on this ecosystem.
module = ["geopandas.*", "pyogrio.*", "shapely.*", "fiona.*", "pandas.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scipy ships incomplete stubs for mypy --strict; ortools' cp_model uses a
# C++-generated Python API (ortools.sat.python.cp_model) with no stubs at
# all -- both are standard practice exclusions for mypy --strict projects.
# pyyaml's upstream stub package (types-PyYAML) is not installed as a
# dev dependency; ignored the same way rather than adding a stub-only
# package for one `yaml.safe_load`/`yaml.safe_dump` call site.
module = ["scipy.*", "ortools.*", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ortools ships a py.typed marker but its pybind11-generated CpModel/
# CpSolver classes (ortools.sat.python.cp_model) do not expose their
# real methods (NewBoolVar, Add, Maximize, ...) to mypy's static
# analysis -- ignore_missing_imports above does not suppress these
# attr-defined errors because the module import itself succeeds with
# partial types. Disabled only for this one file, which is entirely
# CP-SAT model-building code.
module = ["scc_health_pipeline.optimization.location_allocation"]
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
# importlib import mode avoids a module-name collision between the two
# same-named "tests" packages in this monorepo (apps/api/tests and
# pipelines/tests), which otherwise fails collection when both are run
# together (discovered running `make test` for the first time in Phase 2).
addopts = "--import-mode=importlib"
