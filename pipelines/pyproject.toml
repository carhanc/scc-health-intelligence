[project]
name = "scc-health-pipeline"
version = "0.1.0"
description = "Data ingestion, geography, analytics, and export pipelines for Santa Clara Health Intelligence."
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.15.0",
    "pandas>=2.2.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.7.0",
    "pyarrow>=18.0.0",
    "duckdb>=1.5.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.0",
    "libpysal>=4.12.0",
    "esda>=2.6.0",
    "scikit-learn>=1.5.0",
    "ortools>=9.11.0",
    "pyyaml>=6.0.0",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scc_health_pipeline"]
